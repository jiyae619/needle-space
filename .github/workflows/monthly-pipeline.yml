name: Daily data pipeline
run-name: ${{ inputs.dry_run && format('Pipeline dry run ({0})', github.ref_name) || 'Daily data pipeline' }}

# Runs every day (the file is still called monthly-pipeline.yml so its run
# history stays in one place). The Places refresh only calls Google for
# records approaching 28 days old. This keeps Google-derived
# information fresh while avoiding daily full-catalog charges.
#
# The pipeline gates itself on tagging quality BEFORE its finalize stage, so a
# regression stops the run rather than being reported after the search index
# has already been rebuilt from the bad tags. run-pipeline.mjs exits non-zero
# when the gate fails, which fails this job.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra pipeline args, e.g. "--force" for a full re-tag, or "--limit 5" to smoke-test'
        required: false
        default: ""
      # Test a branch (for example a PR's) without touching the live data:
      # every step runs and calls Google / Gemini / Voyage as usual, but
      # nothing is written to Supabase and the quality gate records nothing.
      # Each step handles at most 5 cafes, so it stays quick and cheap.
      dry_run:
        description: "Dry run: write nothing, 5 cafes per step"
        type: boolean
        default: false
      # scripts/clean-cafe-list.mjs: hide non-cafes (7-Eleven, McDonald's,
      # ampm, Circle K) and dead duplicates, and correct every cafe's neighborhood.
      # About 470 cheap Google calls (Essentials tier, 10,000 free a month).
      clean_cafe_list:
        description: "Clean the cafe list first: hide non-cafes, fix neighborhoods"
        type: boolean
        default: false

# Never let two pipeline runs write to the DB at once.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Empty on scheduled runs; "--dry-run --limit 5" when the checkbox is ticked.
      DRY: ${{ inputs.dry_run && '--dry-run --limit 5' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only when ticked; with "Dry run" it reports and writes nothing.
      - name: Clean the cafe list
        if: ${{ inputs.clean_cafe_list }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/clean-cafe-list.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # This checks the 27-day freshness marker before making a Places call.
      # When due, it discovers new cafes and refreshes existing status, address,
      # hours, website, and phone with a narrow, explicit field mask.
      - name: Refresh cafe information and discover new cafes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/refresh-cafe-information.mjs --delay-ms 500 $DRY

      # New cafes arrive with a raw Places photo URL (stored without the key).
      # Copy it into Supabase Storage now, so the site can show it and the
      # vision stage below has a real photo to read. Cached cafes are skipped.
      # `!cancelled()`: a refresh failure is reported (the job still ends red)
      # but no longer stops tagging and finalize for everything else.
      - name: Cache photos for new cafes
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/cache-photos.mjs $DRY

      # Newly discovered cafes have no review corpus yet. Existing places are
      # skipped, so this is inexpensive on non-discovery weeks.
      - name: Analyze reviews for newly discovered cafes
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/analyze-reviews.mjs --new-only $DRY

      # Google's summary of all of a cafe's reviews, for cafes that have none
      # yet. The tagger reads it, and a new summary queues the cafe for
      # re-tagging (up to 100 cafes a run). After the first run this only
      # touches newly discovered cafes.
      - name: Fetch Google review summaries
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/analyze-reviews.mjs --summaries-only $DRY

      - name: Run pipeline
        if: ${{ !cancelled() }}
        env:
          EXTRA_ARGS: ${{ github.event.inputs.args }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Which embedding text finalize builds (v1 or v2). Set the repository
          # variable EMBED_TEXT_VERSION only together with a full re-embed
          # (finalize-cafes.mjs --all --text v2), so the index never mixes both.
          EMBED_TEXT_VERSION: ${{ vars.EMBED_TEXT_VERSION || 'v1' }}
          # Optional LangSmith tracing of the LangGraph run: set the repository
          # variable LANGSMITH_TRACING=true and the secret LANGSMITH_API_KEY.
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: needle-space
        run: npm run pipeline -- $EXTRA_ARGS $DRY

      # Per-cafe node timings, retries, errors and Gemini tokens from the
      # tagging run (scripts/analyze-reviews-llm.mjs), kept for 30 days.
      - name: Upload tagging trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tagging-trace-${{ github.run_id }}
          path: traces/
          if-no-files-found: ignore
          retention-days: 30
