name: Monthly data pipeline

# Runs a lightweight eligibility check daily, but the Places refresh only calls
# Google for records approaching 28 days old. This keeps Google-derived
# information fresh while avoiding daily full-catalog charges.
#
# The pipeline gates itself on tagging quality BEFORE its finalize stage, so a
# regression stops the run rather than being reported after the search index
# has already been rebuilt from the bad tags. run-pipeline.mjs exits non-zero
# when the gate fails, which fails this job.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra pipeline args, e.g. "--force" for a full re-tag, or "--limit 5" to smoke-test'
        required: false
        default: ""

# Never let two pipeline runs write to the DB at once.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This checks the 27-day freshness marker before making a Places call.
      # When due, it discovers new cafes and refreshes existing status, address,
      # hours, website, and phone with a narrow, explicit field mask.
      - name: Refresh cafe information and discover new cafes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/refresh-cafe-information.mjs --delay-ms 500

      # New cafes arrive with a raw Places photo URL (stored without the key).
      # Copy it into Supabase Storage now, so the site can show it and the
      # vision stage below has a real photo to read. Cached cafes are skipped.
      # `!cancelled()`: a refresh failure is reported (the job still ends red)
      # but no longer stops tagging and finalize for everything else.
      - name: Cache photos for new cafes
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/cache-photos.mjs

      # Newly discovered cafes have no review corpus yet. Existing places are
      # skipped, so this is inexpensive on non-discovery weeks.
      - name: Analyze reviews for newly discovered cafes
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/analyze-reviews.mjs --new-only

      # Google's summary of all of a cafe's reviews, for cafes that have none
      # yet. The tagger reads it, and a new summary queues the cafe for
      # re-tagging (up to 100 cafes a run). After the first run this only
      # touches newly discovered cafes.
      - name: Fetch Google review summaries
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY }}
        run: node scripts/analyze-reviews.mjs --summaries-only

      - name: Run pipeline
        if: ${{ !cancelled() }}
        env:
          EXTRA_ARGS: ${{ github.event.inputs.args }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Which embedding text finalize builds (v1 or v2). Set the repository
          # variable EMBED_TEXT_VERSION only together with a full re-embed
          # (finalize-cafes.mjs --all --text v2), so the index never mixes both.
          EMBED_TEXT_VERSION: ${{ vars.EMBED_TEXT_VERSION || 'v1' }}
          # Optional LangSmith tracing of the LangGraph run: set the repository
          # variable LANGSMITH_TRACING=true and the secret LANGSMITH_API_KEY.
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: needle-space
        run: npm run pipeline -- $EXTRA_ARGS

      # Per-cafe node timings, retries, errors and Gemini tokens from the
      # tagging run (scripts/analyze-reviews-llm.mjs), kept for 30 days.
      - name: Upload tagging trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tagging-trace-${{ github.run_id }}
          path: traces/
          if-no-files-found: ignore
          retention-days: 30
