name: Monthly data pipeline

# Runs weekly, but the Places refresh only calls Google for records older than
# 28 days. This keeps Google-derived information inside its permitted freshness
# window while avoiding weekly full-catalog charges.
#
# The pipeline gates itself on tagging quality BEFORE its finalize stage, so a
# regression stops the run rather than being reported after the search index
# has already been rebuilt from the bad tags. run-pipeline.mjs exits non-zero
# when the gate fails, which fails this job.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra pipeline args, e.g. "--force" for a full re-tag, or "--limit 5" to smoke-test'
        required: false
        default: ""

# Never let two pipeline runs write to the DB at once.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This checks the 28-day freshness marker before making a Places call.
      # When due, it discovers new cafes and refreshes existing status, address,
      # hours, website, and phone with a narrow, explicit field mask.
      - name: Refresh cafe information and discover new cafes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY || secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/refresh-cafe-information.mjs --delay-ms 500

      # Newly discovered cafes have no review corpus yet. Existing places are
      # skipped, so this is inexpensive on non-discovery weeks.
      - name: Analyze reviews for newly discovered cafes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY || secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/analyze-reviews.mjs --new-only

      - name: Run pipeline
        env:
          EXTRA_ARGS: ${{ github.event.inputs.args }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: npm run pipeline -- $EXTRA_ARGS
