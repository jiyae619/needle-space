name: Weekly eval

# Measures the live data once a week and posts the numbers to the run summary:
#   1. tag accuracy against human labels from /admin (scripts/evaluate-accuracy.mjs)
#   2. search quality on the golden queries, twice:
#      - direct: the vector index alone (one batched embedding call)
#      - via the app: the production /api/search path, including place
#        filtering, on a local build of this commit
# It reports; it does not block anything. The pipeline's own quality gate is
# what stops a bad tagging run (scripts/quality-metrics.mjs). Weekly, because
# the numbers only move when the search code or the data changes; run it by hand
# (Actions → Weekly eval → Run workflow) after changing either. The file keeps
# its old name, nightly-eval.yml, so its run history stays in one place.

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays, after the 09:00 data pipeline
  workflow_dispatch:

concurrency:
  group: nightly-eval
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag accuracy vs human labels
        run: |
          mkdir -p eval-out
          node scripts/evaluate-accuracy.mjs --json > eval-out/accuracy.json
          node scripts/evaluate-accuracy.mjs --matrices | tee -a "$GITHUB_STEP_SUMMARY"

      # Vector-only vs hybrid (full-text + vector) on the same queries: the
      # evidence for or against turning on SEARCH_HYBRID=1.
      - name: Search quality — vector vs hybrid ranking
        run: |
          node scripts/evaluate-retrieval.mjs --json > eval-out/retrieval-vector.json
          node scripts/evaluate-retrieval.mjs --hybrid --json > eval-out/retrieval-hybrid.json
          { echo; echo "## Search — ranking comparison (database only)"; node -e '
            const p = (x) => x == null ? "—" : (x * 100).toFixed(1) + "%";
            console.log("| ranking | Hit@k | Recall@k | nDCG@k | MRR |"); console.log("|---|---:|---:|---:|---:|");
            for (const f of ["vector", "hybrid"]) {
              const r = require(`./eval-out/retrieval-${f}.json`).summary;
              console.log(`| ${f} | ${p(r.hit_at_k)} | ${p(r.recall_at_k)} | ${r.ndcg_at_k?.toFixed(3)} | ${r.mrr?.toFixed(3)} |`);
            }'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the app
        run: npm run build

      # The route embeds one query per request and Voyage's free tier allows 3 a
      # minute. The two database-only runs above used 2 of this minute's calls,
      # so wait a full minute first; then pace queries 30s apart (~12 minutes
      # for 24 queries), which leaves the live site one search a minute.
      # x-needle-eval keeps them out of nl_query_log.
      - name: Search quality — production path
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          sleep 65
          node scripts/evaluate-retrieval.mjs --via-api --api-base http://localhost:3000 --api-delay-ms 30000 --json > eval-out/retrieval-api.json
          { echo; echo "## Search — production path"; node -e '
            const r = require("./eval-out/retrieval-api.json").summary;
            const p = (x) => x == null ? "—" : (x * 100).toFixed(1) + "%";
            console.log(`Hit@${r.k} ${p(r.hit_at_k)} · Recall@${r.k} ${p(r.recall_at_k)} · nDCG@${r.k} ${r.ndcg_at_k?.toFixed(3)} · MRR ${r.mrr?.toFixed(3)} · ${r.labeled_queries} labeled queries`);'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-${{ github.run_id }}
          path: eval-out/
